name: demoproject-pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  JFROG_CLI_BUILD_NAME: demoproject-pipeline
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
  JFROG_CLI_BUILD_PROJECT: masterdemo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"
          cache: maven

      # ---------------------------------------------------------
      # Pin Maven to avoid the Maven 3.9.16 extractor issue
      # ---------------------------------------------------------
      - name: Install Maven 3.9.9
        run: |
          curl -fsSL \
            https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
            -o /tmp/apache-maven.tar.gz

          sudo tar -xzf /tmp/apache-maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # JFrog CLI
      # ---------------------------------------------------------
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify tools and JFrog connection
        run: |
          java -version
          mvn -version
          jf --version
          jf config show
          jf rt ping

      # ---------------------------------------------------------
      # Maven configuration
      # ---------------------------------------------------------
      - name: Configure Maven repositories
        run: |
          jf mvnc \
            --server-id-resolve=setup-jfrog-cli-server \
            --server-id-deploy=setup-jfrog-cli-server \
            --repo-resolve-releases="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}" \
            --repo-resolve-snapshots="${{ vars.MVN_VIRTUAL_SNAPSHOTS_REPO }}" \
            --repo-deploy-releases="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}" \
            --repo-deploy-snapshots="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}"

      # ---------------------------------------------------------
      # Maven build
      # ---------------------------------------------------------
      - name: Set Maven project version
        run: |
          mvn versions:set \
            -DnewVersion="${{ github.run_number }}" \
            -DgenerateBackupPoms=false

      - name: Build Maven project
        run: |
          jf mvn clean install \
            -DskipTests \
            --project=masterdemo

      # ---------------------------------------------------------
      # Docker build
      # ---------------------------------------------------------
      - name: Set Docker image name
        run: |
          echo "DOCKER_IMAGE=${{ secrets.JF_DOCKER_REGISTRY }}/${{ vars.DOCKER_REPOSITORY }}/masterdemo-dockerbuild:${{ github.run_number }}" \
            >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${DOCKER_IMAGE}" \
            .

      # ---------------------------------------------------------
      # Docker push
      # ---------------------------------------------------------
      - name: Log in to JFrog Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.JF_DOCKER_REGISTRY }}
          username: ${{ secrets.JF_USER }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Push Docker image
        run: |
          jf docker push "${DOCKER_IMAGE}" \
            --project=masterdemo

      # ---------------------------------------------------------
      # Publish combined Maven and Docker build-info
      # ---------------------------------------------------------
      - name: Publish build-info
        run: |
          jf rt build-collect-env
          jf rt build-add-git
          jf rt build-publish \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}" \
            --project=masterdemo
