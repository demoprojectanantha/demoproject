name: demoproject-pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  JFROG_CLI_BUILD_NAME: demoproject-pipeline
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
  JF_PROJECT: masterdemo
    # Existing AppTrust application key—not the display name
  APPTRUST_APPLICATION_KEY: helloworld

  # AppTrust expects a semantic-style version
  APPTRUST_APPLICATION_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"
          cache: maven

      - name: Install Maven 3.9.9
        run: |
          curl -fsSL \
            https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
            -o /tmp/apache-maven.tar.gz

          sudo tar -xzf /tmp/apache-maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify tools and JFrog connection
        run: |
          java -version
          mvn -version
          jf --version
          jf config show
          jf rt ping

      - name: Configure Maven repositories
        run: |
          jf mvnc \
            --server-id-resolve=setup-jfrog-cli-server \
            --server-id-deploy=setup-jfrog-cli-server \
            --repo-resolve-releases="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}" \
            --repo-resolve-snapshots="${{ vars.MVN_VIRTUAL_SNAPSHOTS_REPO }}" \
            --repo-deploy-releases="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}" \
            --repo-deploy-snapshots="${{ vars.MVN_VIRTUAL_SNAPSHOTS_REPO }}"

      # Resolve and display dependencies before changing the POM version.
      - name: Display Maven dependency tree
        run: |
          mvn dependency:tree \
            -DoutputType=text \
            -DoutputFile=dependency-tree.txt

          echo "===== Maven dependency tree ====="
          cat dependency-tree.txt

      # Submit the current pom.xml dependency graph to GitHub.
      - name: Submit Maven dependencies to GitHub
        uses: advanced-security/maven-dependency-submission-action@v5

      # Change the application version only after dependency submission.
      - name: Set Maven project version
        run: |
          mvn versions:set \
            -DnewVersion="${{ github.run_number }}" \
            -DgenerateBackupPoms=false

      - name: Build Maven project
        run: |
          jf mvn clean install \
            -DskipTests

      - name: Set Docker image name
        run: |
          echo "DOCKER_IMAGE=${{ secrets.JF_DOCKER_REGISTRY }}/${{ vars.DOCKER_REPOSITORY }}/masterdemo-dockerbuild:${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          jf docker build \
            --tag "${DOCKER_IMAGE}" \
            .

      - name: Push Docker image
        run: |
          jf docker push "${DOCKER_IMAGE}"

      - name: Publish build-info
        run: |
          jf rt build-collect-env \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}"

          jf rt build-add-git \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}"

          jf rt build-publish \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}" \
            --project="${JF_PROJECT}"

      - name: Create AppTrust source spec
        run: |
          cat > apptrust-sources.json <<EOF
          {
            "builds": [
              {
                "name": "${JFROG_CLI_BUILD_NAME}",
                "number": "${JFROG_CLI_BUILD_NUMBER}",
                "repository_key": "${JF_PROJECT}-build-info",
                "include_dependencies": true
              }
            ]
          }
          EOF

          echo "===== AppTrust source spec ====="
          cat apptrust-sources.json

      - name: Create AppTrust application version
        run: |
          jf apptrust version-create \
            "${APPTRUST_APPLICATION_KEY}" \
            "${APPTRUST_APPLICATION_VERSION}" \
            --spec="apptrust-sources.json" \
            --tag="github-run-${GITHUB_RUN_NUMBER}"
