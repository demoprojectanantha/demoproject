name: demoproject-pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: read
  id-token: write
  packages: write
  contents: write
  security-events: write
  attestations: write
  vulnerability-alerts: read

env:
  JFROG_CLI_BUILD_NAME: demoproject-pipeline
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
  JF_PROJECT: masterdemo

  # Existing AppTrust application key, not the display name.
  APPTRUST_APPLICATION_KEY: helloworld

  # AppTrust application version.
  APPTRUST_APPLICATION_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build and publish build-info
    runs-on: ubuntu-latest

    outputs:
      docker-image: ${{ steps.set-docker-metadata.outputs.docker-image }}
      docker-subject: ${{ steps.set-docker-metadata.outputs.docker-subject }}
      docker-digest: ${{ steps.push-docker.outputs.digest }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"
          cache: maven

      - name: Install Maven 3.9.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz" \
            -o /tmp/apache-maven.tar.gz

          sudo tar -xzf /tmp/apache-maven.tar.gz -C /opt

          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify tools and JFrog connection
        shell: bash
        run: |
          set -euo pipefail

          java -version
          mvn -version
          jf --version
          jf config show
          jf rt ping

      - name: Configure Maven repositories
        shell: bash
        run: |
          set -euo pipefail

          jf mvnc \
            --server-id-resolve=setup-jfrog-cli-server \
            --server-id-deploy=setup-jfrog-cli-server \
            --repo-resolve-releases="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}" \
            --repo-resolve-snapshots="${{ vars.MVN_VIRTUAL_SNAPSHOTS_REPO }}" \
            --repo-deploy-releases="${{ vars.MVN_VIRTUAL_RELEASE_REPO }}" \
            --repo-deploy-snapshots="${{ vars.MVN_VIRTUAL_SNAPSHOTS_REPO }}"

      - name: Display Maven dependency tree
        shell: bash
        run: |
          set -euo pipefail

          mvn dependency:tree \
            -DoutputType=text \
            -DoutputFile=dependency-tree.txt

          echo "===== Maven dependency tree ====="
          cat dependency-tree.txt

      - name: Submit Maven dependencies to GitHub
        uses: advanced-security/maven-dependency-submission-action@v5

      - name: Set Maven project version
        shell: bash
        run: |
          set -euo pipefail

          mvn versions:set \
            -DnewVersion="${GITHUB_RUN_NUMBER}" \
            -DgenerateBackupPoms=false

      - name: Build Maven project
        shell: bash
        run: |
          set -euo pipefail

          jf mvn clean install

      - name: Set Docker image metadata
        id: set-docker-metadata
        shell: bash
        run: |
          set -euo pipefail

          DOCKER_IMAGE="${{ secrets.JF_DOCKER_REGISTRY }}/${{ vars.DOCKER_REPOSITORY }}/masterdemo-dockerbuild:${GITHUB_RUN_NUMBER}"
          DOCKER_SUBJECT="oci://${{ secrets.JF_DOCKER_REGISTRY }}/${{ vars.DOCKER_REPOSITORY }}/masterdemo-dockerbuild"

          echo "DOCKER_IMAGE=${DOCKER_IMAGE}" >> "$GITHUB_ENV"
          echo "DOCKER_SUBJECT=${DOCKER_SUBJECT}" >> "$GITHUB_ENV"

          echo "docker-image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "docker-subject=${DOCKER_SUBJECT}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          jf docker build \
            --tag "${DOCKER_IMAGE}" \
            .

      - name: Push Docker image
        id: push-docker
        shell: bash
        run: |
          set -euo pipefail

          jf docker push "${DOCKER_IMAGE}"

          IMAGE_DIGEST="$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "${DOCKER_IMAGE}" | cut -d'@' -f2)"

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "Could not determine the pushed Docker image digest."
            exit 1
          fi

          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image digest: ${IMAGE_DIGEST}"

      # This must remain in the same job where Maven and Docker build-info
      # were collected. A new GitHub Actions job has a new runner and does
      # not contain the previous runner's local JFrog build-info state.
      - name: Collect build environment
        shell: bash
        run: |
          set -euo pipefail

          jf rt build-collect-env \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}"

      - name: Add Git information to build-info
        shell: bash
        run: |
          set -euo pipefail

          jf rt build-add-git \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}"

      - name: Publish build-info
        shell: bash
        run: |
          set -euo pipefail

          jf rt build-publish \
            "${JFROG_CLI_BUILD_NAME}" \
            "${JFROG_CLI_BUILD_NUMBER}" \
            --project="${JF_PROJECT}"

  apptrust:
    name: Create and promote AppTrust version
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify JFrog connection
        shell: bash
        run: |
          set -euo pipefail

          jf --version
          jf config show
          jf rt ping

      - name: Create AppTrust source specification
        shell: bash
        run: |
          set -euo pipefail

          cat > apptrust-sources.json <<EOF
          {
            "builds": [
              {
                "name": "${JFROG_CLI_BUILD_NAME}",
                "number": "${JFROG_CLI_BUILD_NUMBER}",
                "repository_key": "${JF_PROJECT}-build-info",
                "include_dependencies": true
              }
            ]
          }
          EOF

          echo "===== AppTrust source spec ====="
          cat apptrust-sources.json

      - name: Create AppTrust application version
        shell: bash
        run: |
          set -euo pipefail

          jf apptrust version-create \
            "${APPTRUST_APPLICATION_KEY}" \
            "${APPTRUST_APPLICATION_VERSION}" \
            --spec="apptrust-sources.json" \
            --tag="github-run-${GITHUB_RUN_NUMBER}"

      - name: Collect open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            --slurp \
            | jq 'flatten' \
            > dependabot-alerts-raw.json

          ALERT_COUNT="$(jq 'length' dependabot-alerts-raw.json)"

          jq \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson alert_count "${ALERT_COUNT}" \
            '{
              repository: $repository,
              commit: $commit,
              workflow_run: $workflow_run,
              collected_at: (now | todate),
              open_alert_count: $alert_count,
              alerts: [
                .[] | {
                  number: .number,
                  state: .state,
                  dependency: {
                    package: .dependency.package.name,
                    ecosystem: .dependency.package.ecosystem,
                    manifest_path: .dependency.manifest_path,
                    scope: .dependency.scope
                  },
                  security_advisory: {
                    ghsa_id: .security_advisory.ghsa_id,
                    cve_id: .security_advisory.cve_id,
                    summary: .security_advisory.summary,
                    severity: .security_advisory.severity
                  },
                  vulnerable_version_range:
                    .security_vulnerability.vulnerable_version_range,
                  first_patched_version:
                    .security_vulnerability.first_patched_version.identifier
                }
              ]
            }' dependabot-alerts-raw.json \
            > dependabot-evidence.json

          echo "===== Dependabot evidence ====="
          cat dependabot-evidence.json

      - name: Prepare JFrog Evidence signing key
        env:
          EVIDENCE_PRIVATE_KEY: ${{ secrets.JFROG_EVIDENCE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EVIDENCE_PRIVATE_KEY}" ]]; then
            echo "JFROG_EVIDENCE_PRIVATE_KEY is not configured."
            exit 1
          fi

          printf '%s' "${EVIDENCE_PRIVATE_KEY}" \
            > "${RUNNER_TEMP}/dependabot-evidence-private-key.pem"

          chmod 600 \
            "${RUNNER_TEMP}/dependabot-evidence-private-key.pem"

      - name: Attach Dependabot alerts as AppTrust evidence
        shell: bash
        run: |
          set -euo pipefail

          jf evd create \
            --predicate="dependabot-evidence.json" \
            --predicate-type="https://github.com/dependabot/alerts/v1" \
            --application-key="${APPTRUST_APPLICATION_KEY}" \
            --application-version="${APPTRUST_APPLICATION_VERSION}" \
            --key="${RUNNER_TEMP}/dependabot-evidence-private-key.pem" \
            --key-alias="default-lifecycle-key" \
            --provider-id="github-dependabot"

      - name: Promote through lifecycle
        shell: bash
        run: |
          set -euo pipefail

          stages=(DEV TEST QA TRAIN)

          for stage in "${stages[@]}"; do
            echo "Promoting ${APPTRUST_APPLICATION_KEY} version ${APPTRUST_APPLICATION_VERSION} to ${stage}"

            success=false

            for attempt in 1 2 3; do
              if jf apptrust version-promote \
                "${APPTRUST_APPLICATION_KEY}" \
                "${APPTRUST_APPLICATION_VERSION}" \
                "${stage}" \
                --promotion-type=copy; then

                success=true
                break
              fi

              echo "Attempt ${attempt} failed for ${stage}"

              if [[ "${attempt}" -lt 3 ]]; then
                echo "Waiting 20 seconds before retry..."
                sleep 20
              fi
            done

            if [[ "${success}" != "true" ]]; then
              echo "Promotion to ${stage} failed after 3 attempts."
              exit 1
            fi
          done

      - name: Release application version to PROD
        shell: bash
        run: |
          set -euo pipefail

          jf apptrust version-release \
            "${APPTRUST_APPLICATION_KEY}" \
            "${APPTRUST_APPLICATION_VERSION}"

  provenance:
    name: Create GitHub build provenance
    needs:
      - build
      - apptrust

    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.build.outputs.docker-subject }}
          subject-digest: ${{ needs.build.outputs.docker-digest }}
